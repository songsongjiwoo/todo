<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="app">
        <header class="header">
          <div class="title-wrap">
            <p class="eyebrow">Daily Planner</p>
            <h1>Todo List</h1>
          </div>

          <div class="stats" aria-label="할 일 통계">
            <div class="stat-card total">
              <span class="stat-label">전체</span>
              <strong id="total-count">0</strong>
            </div>
            <div class="stat-card active">
              <span class="stat-label">진행중</span>
              <strong id="active-count">0</strong>
            </div>
            <div class="stat-card done">
              <span class="stat-label">완료</span>
              <strong id="completed-count">0</strong>
            </div>
          </div>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="할 일을 입력하세요"
            aria-label="할 일 입력"
            maxlength="100"
          />
          <button type="submit">추가</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-message" class="empty-message">아직 할 일이 없습니다.</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
